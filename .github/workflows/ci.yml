name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PostgreSQL and native verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-19 curl llvm-19 minisign pkg-config \
            postgresql-16 postgresql-server-dev-16
          PG_BIN="/usr/lib/postgresql/16/bin"
          PG_CONFIG="$PG_BIN/pg_config"
          test -x /usr/bin/clang-19
          test -x /usr/lib/llvm-19/bin/llvm-lto
          test -x "$PG_BIN/pg_ctl"
          test -x "$PG_CONFIG"
          test "$("$PG_CONFIG" --bindir)" = "$PG_BIN"
          "$PG_CONFIG" --version
          "$PG_BIN/postgres" --version
          echo "$PG_BIN" >> "$GITHUB_PATH"
          echo "PG_CONFIG=$PG_CONFIG" >> "$GITHUB_ENV"

      - name: Build verified libsodium 1.0.22
        run: |
          readonly SODIUM_VERSION=1.0.22
          readonly SODIUM_KEY=RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3
          readonly SODIUM_ARCHIVE="/tmp/libsodium-${SODIUM_VERSION}.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$SODIUM_ARCHIVE" "https://download.libsodium.org/libsodium/releases/libsodium-${SODIUM_VERSION}.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${SODIUM_ARCHIVE}.minisig" "https://download.libsodium.org/libsodium/releases/libsodium-${SODIUM_VERSION}.tar.gz.minisig"
          minisign -Vm "$SODIUM_ARCHIVE" -P "$SODIUM_KEY"
          tar --extract --file "$SODIUM_ARCHIVE" --directory /tmp
          pushd "/tmp/libsodium-${SODIUM_VERSION}"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          popd
          sudo ldconfig
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
          test "$(pkg-config --modversion libsodium)" = "$SODIUM_VERSION"
          LD_LIBRARY_PATH=/usr/local/lib python -c "import ctypes; library = ctypes.CDLL('libsodium.so'); library.sodium_version_string.restype = ctypes.c_char_p; assert library.sodium_version_string().decode() == '1.0.22'"
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"

      - name: Build verify-only PostgreSQL extension
        run: |
          test "$(pkg-config --modversion libsodium)" = "1.0.22"
          make -C native/gah_ed25519 PG_CONFIG="$PG_CONFIG"
          sudo make -C native/gah_ed25519 install PG_CONFIG="$PG_CONFIG"

      - name: Verify PyNaCl source provenance
        run: |
          mkdir -p /tmp/gah-pynacl-source
          python -m pip download --no-deps --no-binary=:all: --dest /tmp/gah-pynacl-source PyNaCl==1.6.2
          test "$(sha256sum /tmp/gah-pynacl-source/pynacl-1.6.2.tar.gz | awk '{print $1}')" = "018494d6d696ae03c7e656e5e74cdfd8ea1326962cc401bcf018f1ed8436811c"
          python -m pip install --no-deps /tmp/gah-pynacl-source/pynacl-1.6.2.tar.gz

      - name: Install test dependencies
        run: |
          # Keep the already verified PyNaCl sdist installed; install every
          # other test/runtime dependency explicitly so pip cannot replace it.
          python -m pip install -e . --no-deps
          python -m pip install 'build>=1.2,<2' 'cffi>=1.4.1' 'mcp==2.0.0' 'psycopg[binary]>=3.2,<4' 'pytest>=8,<9' 'ruff>=0.12,<1' 'setuptools>=68,<81' 'wheel>=0.44,<1'
          python -m pip check
          python -c "import nacl; assert nacl.__version__ == '1.6.2'"

      - name: Check formatting and lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: GAH_REQUIRE_POSTGRES=1 pytest -q

      - name: Check patch hygiene
        run: git diff --check
